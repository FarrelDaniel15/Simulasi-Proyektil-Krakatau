  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    const KRAKATAU_LAT = -6.102;
    const KRAKATAU_LNG = 105.423;
    const GLOBE_RADIUS = 300;

    const DEFAULT_PARAMS = {
      v0: 450,            // Launch velocity (m/s)
      angle: 60,          // Launch angle (degrees)
      y0: 150,            // Crater elevation above sea level (m)
      mass: 1200,         // Projectile mass (kg)
      cd: 0.47,           // Drag coefficient
      area: 0.85,         // Cross-sectional area (m^2)
      gravity: 9.81,      // Gravity m/s^2
      windSpeed: 15,      // Wind speed (m/s)
      windAngle: 90,      // Wind direction angle
      rho0: 1.225,        // Atmospheric density at sea level
      scaleHeight: 8500,  // Scale height (m)
      dt: 0.02,           // Time step (s)
      solver: 'rk4',      // Integration solver
      headingAngle: 45,   // Launch compass heading
    };

    const PRESETS = {
      low: {
        name: 'Erupsi Strombolian',
        desc: 'Semburan bom lava ringan dengan jangkauan beberapa ratus meter.',
        params: { ...DEFAULT_PARAMS, v0: 180, angle: 70, mass: 400, y0: 120 }
      },
      medium: {
        name: 'Erupsi Vulcanian (Standar)',
        desc: 'Eksplosivitas sedang, melempar bom vulkanik ke Selat Sunda.',
        params: { ...DEFAULT_PARAMS, v0: 450, angle: 55, mass: 1200, windSpeed: 15 }
      },
      high: {
        name: 'Erupsi Plinian Dahsyat',
        desc: 'Lontaran energi raksasa hingga puluhan kilometer.',
        params: { ...DEFAULT_PARAMS, v0: 750, angle: 48, mass: 3000, windSpeed: 30 }
      },
      historical: {
        name: 'Katastrofe Krakatau 1883',
        desc: 'Lontaran mega-tephra historis saat kehancuran kaldera.',
        params: { ...DEFAULT_PARAMS, v0: 980, angle: 42, mass: 6000, windSpeed: 45, y0: 300 }
      }
    };

    function latLngToVector3(lat, lng, radius) {
      const phi = (90 - lat) * (Math.PI / 180);
      const theta = (lng + 180) * (Math.PI / 180);
      const x = -(radius * Math.sin(phi) * Math.cos(theta));
      const z = radius * Math.sin(phi) * Math.sin(theta);
      const y = radius * Math.cos(phi);
      return new THREE.Vector3(x, y, z);
    }

    function createProceduralEarthTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#1e293b';
      ctx.beginPath();
      ctx.arc(750, 280, 120, 0, Math.PI * 2);
      ctx.arc(250, 220, 160, 0, Math.PI * 2);
      ctx.arc(520, 200, 140, 0, Math.PI * 2);
      ctx.arc(780, 340, 90, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#334155';
      ctx.beginPath();
      ctx.arc(765, 290, 80, 0, Math.PI * 2);
      ctx.arc(530, 180, 100, 0, Math.PI * 2);
      ctx.fill();

      return new THREE.CanvasTexture(canvas);
    }

    function getAirDensity(y, rho0 = 1.225, scaleHeight = 8500) {
      if (y < 0) return rho0;
      return rho0 * Math.exp(-y / scaleHeight);
    }

    function getDerivatives(state, params) {
      const { x, y, vx, vy } = state;
      const { mass, cd, area, gravity, windSpeed, windAngle, rho0, scaleHeight } = params;

      const windRad = (windAngle * Math.PI) / 180;
      const vWindX = windSpeed * Math.cos(windRad);
      const vWindY = windSpeed * Math.sin(windRad);

      const vRelX = vx - vWindX;
      const vRelY = vy - vWindY;
      const vRel = Math.sqrt(vRelX * vRelX + vRelY * vRelY);

      const rho = getAirDensity(y, rho0, scaleHeight);
      const dragFactor = -0.5 * rho * cd * area * vRel;
      const F_drag_x = dragFactor * vRelX;
      const F_drag_y = dragFactor * vRelY;

      const ax = F_drag_x / mass;
      const ay = -gravity + (F_drag_y / mass);

      return {
        dx: vx,
        dy: vy,
        dvx: ax,
        dvy: ay,
        fDragX: F_drag_x,
        fDragY: F_drag_y,
        rho: rho,
        vRel: vRel
      };
    }

    function computeTrajectory(params, solverOverride = null, dragCoeffOverride = null) {
      const solver = solverOverride || params.solver || 'rk4';
      const cd = dragCoeffOverride !== null ? dragCoeffOverride : params.cd;
      const effectiveParams = { ...params, cd };

      const angleRad = (effectiveParams.angle * Math.PI) / 180;
      let state = {
        x: 0,
        y: effectiveParams.y0,
        vx: effectiveParams.v0 * Math.cos(angleRad),
        vy: effectiveParams.v0 * Math.sin(angleRad),
      };

      const dt = effectiveParams.dt || 0.02;
      let t = 0;
      const path = [];
      let maxHeight = state.y;
      let initialME = 0.5 * effectiveParams.mass * effectiveParams.v0 * effectiveParams.v0 + effectiveParams.mass * effectiveParams.gravity * effectiveParams.y0;
      let totalEnergyDissipated = 0;

      while (state.y >= 0 && t < 600) {
        const deriv = getDerivatives(state, effectiveParams);
        const vMag = Math.sqrt(state.vx * state.vx + state.vy * state.vy);
        const fDragMag = Math.sqrt(deriv.fDragX * deriv.fDragX + deriv.fDragY * deriv.fDragY);

        path.push({
          t: t,
          x: state.x,
          y: state.y,
          vx: state.vx,
          vy: state.vy,
          v: vMag,
          fDragX: deriv.fDragX,
          fDragY: deriv.fDragY,
          fDrag: fDragMag,
          ax: deriv.dvx,
          ay: deriv.dvy,
          rho: deriv.rho
        });

        if (state.y > maxHeight) maxHeight = state.y;

        let newState;
        if (solver === 'euler') {
          newState = {
            x: state.x + dt * deriv.dx,
            y: state.y + dt * deriv.dy,
            vx: state.vx + dt * deriv.dvx,
            vy: state.vy + dt * deriv.dvy,
          };
        } else {
          // RK4
          const k1 = deriv;
          const s2 = {
            x: state.x + 0.5 * dt * k1.dx,
            y: state.y + 0.5 * dt * k1.dy,
            vx: state.vx + 0.5 * dt * k1.dvx,
            vy: state.vy + 0.5 * dt * k1.dvy,
          };
          const k2 = getDerivatives(s2, effectiveParams);

          const s3 = {
            x: state.x + 0.5 * dt * k2.dx,
            y: state.y + 0.5 * dt * k2.dy,
            vx: state.vx + 0.5 * dt * k2.dvx,
            vy: state.vx + 0.5 * dt * k2.dvy,
          };
          const k3 = getDerivatives(s3, effectiveParams);

          const s4 = {
            x: state.x + dt * k3.dx,
            y: state.y + dt * k3.dy,
            vx: state.vx + dt * k3.dvx,
            vy: state.vy + dt * k3.dvy,
          };
          const k4 = getDerivatives(s4, effectiveParams);

          newState = {
            x: state.x + (dt / 6) * (k1.dx + 2 * k2.dx + 2 * k3.dx + k4.dx),
            y: state.y + (dt / 6) * (k1.dy + 2 * k2.dy + 2 * k3.dy + k4.dy),
            vx: state.vx + (dt / 6) * (k1.dvx + 2 * k2.dvx + 2 * k3.dvx + k4.dvx),
            vy: state.vy + (dt / 6) * (k1.dvy + 2 * k2.dvy + 2 * k3.dvy + k4.dvy),
          };
        }

        totalEnergyDissipated += fDragMag * vMag * dt;

        state = newState;
        t += dt;
      }

      const lastPt = path[path.length - 1] || { x: 0, y: 0, v: 0, t: 0 };
      const maxRange = lastPt.x;
      const flightTime = lastPt.t;
      const impactSpeed = lastPt.v;

      return {
        path,
        summary: {
          maxRange,
          maxHeight,
          flightTime,
          impactSpeed,
          initialME,
          energyDissipated: totalEnergyDissipated,
        }
      };
    }

    function Globe3DVisualizer({ trajectoryData, simParams, activePointIndex, simStatus, onRun, onPause, onReset, setActiveFrameIndex }) {
      const containerRef = useRef(null);
      const sceneRef = useRef(null);
      const cameraRef = useRef(null);
      const rendererRef = useRef(null);
      const controlsRef = useRef(null);

      const earthMeshRef = useRef(null);
      const volcanoGroupRef = useRef(null);
      const projectileMeshRef = useRef(null);
      const projLightRef = useRef(null);
      const trailParticlesRef = useRef(null);
      const impactRingRef = useRef(null);
      const lineMeshRef = useRef(null);
      const activeLineMeshRef = useRef(null);
      const particlesRef = useRef(null);

      const [cameraPreset, setCameraPreset] = useState('krakatau');

      useEffect(() => {
        if (!containerRef.current) return;

        const width = containerRef.current.clientWidth;
        const height = containerRef.current.clientHeight;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x060911);
        sceneRef.current = scene;

        const camera = new THREE.PerspectiveCamera(45, width / height, 1, 10000);
        cameraRef.current = camera;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        rendererRef.current = renderer;

        containerRef.current.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 2500;
        controls.minDistance = 320;
        controlsRef.current = controls;

        const starsGeo = new THREE.BufferGeometry();
        const starCount = 1800;
        const starPos = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount * 3; i += 3) {
          starPos[i] = (Math.random() - 0.5) * 6000;
          starPos[i + 1] = (Math.random() - 0.5) * 6000;
          starPos[i + 2] = (Math.random() - 0.5) * 6000;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starsMat = new THREE.PointsMaterial({ color: 0x38bdf8, size: 2.2, transparent: true, opacity: 0.5 });
        const starField = new THREE.Points(starsGeo, starsMat);
        scene.add(starField);

        const ambientLight = new THREE.AmbientLight(0x64748b, 1.4);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfff7ed, 2.2);
        sunLight.position.set(1000, 1000, 1500);
        scene.add(sunLight);

        const earthGeo = new THREE.SphereGeometry(GLOBE_RADIUS, 96, 96);
        const earthTex = createProceduralEarthTexture();
        const earthMat = new THREE.MeshStandardMaterial({
          map: earthTex,
          roughness: 0.6,
          metalness: 0.2,
        });
        const earth = new THREE.Mesh(earthGeo, earthMat);
        scene.add(earth);
        earthMeshRef.current = earth;

        const atmosGeo = new THREE.SphereGeometry(GLOBE_RADIUS + 4, 64, 64);
        const atmosMat = new THREE.MeshBasicMaterial({
          color: 0x00f0ff,
          transparent: true,
          opacity: 0.12,
          side: THREE.BackSide,
        });
        const atmos = new THREE.Mesh(atmosGeo, atmosMat);
        scene.add(atmos);

        const krakatauPos = latLngToVector3(KRAKATAU_LAT, KRAKATAU_LNG, GLOBE_RADIUS);

        const volcanoGroup = new THREE.Group();
        volcanoGroup.position.copy(krakatauPos);

        const normal = krakatauPos.clone().normalize();
        const up = new THREE.Vector3(0, 1, 0);
        const quaternion = new THREE.Quaternion().setFromUnitVectors(up, normal);
        volcanoGroup.quaternion.copy(quaternion);

        const islandGeo = new THREE.CylinderGeometry(14, 28, 6, 32);
        const islandMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.9 });
        const island = new THREE.Mesh(islandGeo, islandMat);
        island.position.y = 3;
        volcanoGroup.add(island);

        const coneGeo = new THREE.ConeGeometry(10, 12, 32, 1, true);
        const coneMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.8 });
        const cone = new THREE.Mesh(coneGeo, coneMat);
        cone.position.y = 12;
        volcanoGroup.add(cone);

        const magmaGeo = new THREE.CircleGeometry(5, 16);
        const magmaMat = new THREE.MeshBasicMaterial({ color: 0xff4500, side: THREE.DoubleSide });
        const magma = new THREE.Mesh(magmaGeo, magmaMat);
        magma.rotation.x = Math.PI / 2;
        magma.position.y = 17.5;
        volcanoGroup.add(magma);

        const volcanoLight = new THREE.PointLight(0xff6600, 8, 150);
        volcanoLight.position.y = 18;
        volcanoGroup.add(volcanoLight);

        scene.add(volcanoGroup);
        volcanoGroupRef.current = volcanoGroup;

        const projGroup = new THREE.Group();
        
        const projGeo = new THREE.SphereGeometry(5.5, 16, 16);
        const projMat = new THREE.MeshStandardMaterial({
          color: 0xff3300,
          emissive: 0xff6600,
          emissiveIntensity: 1.5,
          roughness: 0.2
        });
        const projMesh = new THREE.Mesh(projGeo, projMat);
        projGroup.add(projMesh);

        const glowGeo = new THREE.SphereGeometry(9.0, 16, 16);
        const glowMat = new THREE.MeshBasicMaterial({
          color: 0xff8a3d,
          transparent: true,
          opacity: 0.45
        });
        const glowMesh = new THREE.Mesh(glowGeo, glowMat);
        projGroup.add(glowMesh);

        const projLight = new THREE.PointLight(0xff6600, 10, 120);
        projGroup.add(projLight);
        projLightRef.current = projLight;

        projGroup.position.copy(krakatauPos);
        scene.add(projGroup);
        projectileMeshRef.current = projGroup;

        const trailCount = 60;
        const trailGeo = new THREE.BufferGeometry();
        const trailPositions = new Float32Array(trailCount * 3);
        for(let i=0; i<trailCount; i++) {
          trailPositions[i*3] = krakatauPos.x;
          trailPositions[i*3+1] = krakatauPos.y;
          trailPositions[i*3+2] = krakatauPos.z;
        }
        trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPositions, 3));
        const trailMat = new THREE.PointsMaterial({
          color: 0xff8a3d,
          size: 4.5,
          transparent: true,
          opacity: 0.8,
          blending: THREE.AdditiveBlending
        });
        const trailPoints = new THREE.Points(trailGeo, trailMat);
        scene.add(trailPoints);
        trailParticlesRef.current = trailPoints;

        const ringGeo = new THREE.RingGeometry(1, 12, 32);
        const ringMat = new THREE.MeshBasicMaterial({
          color: 0xff0033,
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0
        });
        const ringMesh = new THREE.Mesh(ringGeo, ringMat);
        scene.add(ringMesh);
        impactRingRef.current = ringMesh;

        const pCount = 200;
        const pGeo = new THREE.BufferGeometry();
        const pPos = new Float32Array(pCount * 3);
        for (let i = 0; i < pCount * 3; i += 3) {
          pPos[i] = (Math.random() - 0.5) * 6;
          pPos[i + 1] = 18 + Math.random() * 20;
          pPos[i + 2] = (Math.random() - 0.5) * 6;
        }
        pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
        const pMat = new THREE.PointsMaterial({ color: 0xff8a3d, size: 3.5, transparent: true, opacity: 0.6 });
        const pMesh = new THREE.Points(pGeo, pMat);
        volcanoGroup.add(pMesh);
        particlesRef.current = pMesh;

        const camTarget = krakatauPos;
        const camOffset = normal.clone().multiplyScalar(120).add(new THREE.Vector3(30, 40, 50));
        camera.position.copy(krakatauPos.clone().add(camOffset));
        controls.target.copy(camTarget);
        controls.update();

        let animId;
        const animate = () => {
          animId = requestAnimationFrame(animate);
          controls.update();

          if (particlesRef.current) {
            const positions = particlesRef.current.geometry.attributes.position;
            for (let i = 0; i < pCount; i++) {
              let py = positions.getY(i);
              py += 0.4 + Math.random() * 0.3;
              if (py > 55) py = 18;
              positions.setY(i, py);
            }
            positions.needsUpdate = true;
          }

          renderer.render(scene, camera);
        };
        animate();

        const handleResize = () => {
          if (!containerRef.current) return;
          const w = containerRef.current.clientWidth;
          const h = containerRef.current.clientHeight;
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
          renderer.setSize(w, h);
        };
        window.addEventListener('resize', handleResize);

        return () => {
          window.removeEventListener('resize', handleResize);
          cancelAnimationFrame(animId);
          if (rendererRef.current && rendererRef.current.domElement) {
            rendererRef.current.domElement.remove();
          }
        };
      }, []);

      useEffect(() => {
        if (!sceneRef.current || !trajectoryData.path || trajectoryData.path.length === 0) return;

        if (lineMeshRef.current) sceneRef.current.remove(lineMeshRef.current);
        if (activeLineMeshRef.current) sceneRef.current.remove(activeLineMeshRef.current);

        const krakatauPos = latLngToVector3(KRAKATAU_LAT, KRAKATAU_LNG, GLOBE_RADIUS);
        const surfaceNormal = krakatauPos.clone().normalize();

        const headingRad = (simParams.headingAngle * Math.PI) / 180;
        const northTangent = new THREE.Vector3(0, 1, 0).projectOnPlane(surfaceNormal).normalize();
        const eastTangent = new THREE.Vector3().crossVectors(surfaceNormal, northTangent).normalize();

        const launchDir = new THREE.Vector3()
          .addScaledVector(northTangent, Math.cos(headingRad))
          .addScaledVector(eastTangent, Math.sin(headingRad))
          .normalize();

        const scaleFactor = 0.0018;

        const points3D = trajectoryData.path.map((pt) => {
          const distScaled = pt.x * scaleFactor;
          const altScaled = pt.y * scaleFactor;

          return krakatauPos.clone()
            .addScaledVector(launchDir, distScaled)
            .normalize()
            .multiplyScalar(GLOBE_RADIUS + altScaled);
        });

        const geometry = new THREE.BufferGeometry().setFromPoints(points3D);
        const material = new THREE.LineBasicMaterial({ color: 0x00f0ff, opacity: 0.25, transparent: true });
        const line = new THREE.Line(geometry, material);
        sceneRef.current.add(line);
        lineMeshRef.current = line;

        const activeGeo = new THREE.BufferGeometry().setFromPoints([points3D[0], points3D[0]]);
        const activeMat = new THREE.LineBasicMaterial({ color: 0xff6600, linewidth: 4 });
        const activeLine = new THREE.Line(activeGeo, activeMat);
        sceneRef.current.add(activeLine);
        activeLineMeshRef.current = activeLine;

      }, [trajectoryData, simParams.headingAngle]);

      useEffect(() => {
        if (!trajectoryData.path || trajectoryData.path.length === 0 || !lineMeshRef.current) return;

        const idx = Math.min(activePointIndex, trajectoryData.path.length - 1);
        const points = lineMeshRef.current.geometry.attributes.position;

        if (points && projectileMeshRef.current) {
          const px = points.getX(idx);
          const py = points.getY(idx);
          const pz = points.getZ(idx);

          const curPos = new THREE.Vector3(px, py, pz);
          projectileMeshRef.current.position.set(px, py, pz);

          if (activeLineMeshRef.current) {
            const activePts = [];
            for (let i = 0; i <= idx; i++) {
              activePts.push(new THREE.Vector3(points.getX(i), points.getY(i), points.getZ(i)));
            }
            if (activePts.length > 0) {
              activeLineMeshRef.current.geometry.dispose();
              activeLineMeshRef.current.geometry = new THREE.BufferGeometry().setFromPoints(activePts);
            }
          }

          if (trailParticlesRef.current) {
            const trailGeo = trailParticlesRef.current.geometry;
            const trailPos = trailGeo.attributes.position;
            const count = trailPos.count;

            for (let i = count - 1; i > 0; i--) {
              trailPos.setXYZ(i, trailPos.getX(i - 1), trailPos.getY(i - 1), trailPos.getZ(i - 1));
            }
            trailPos.setXYZ(0, px, py, pz);
            trailPos.needsUpdate = true;
          }

          if (impactRingRef.current) {
            const isFinished = idx >= trajectoryData.path.length - 1;
            if (isFinished) {
              const normal = curPos.clone().normalize();
              const up = new THREE.Vector3(0, 0, 1);
              const q = new THREE.Quaternion().setFromUnitVectors(up, normal);
              impactRingRef.current.position.copy(curPos);
              impactRingRef.current.quaternion.copy(q);
              impactRingRef.current.material.opacity = 0.9;
              impactRingRef.current.scale.set(3, 3, 3);
            } else {
              impactRingRef.current.material.opacity = 0;
            }
          }

          if (cameraPreset === 'follow' && cameraRef.current && controlsRef.current) {
            const normal = curPos.clone().normalize();
            cameraRef.current.position.copy(curPos.clone().add(normal.multiplyScalar(110)));
            controlsRef.current.target.copy(curPos);
          }
        }
      }, [activePointIndex, trajectoryData, cameraPreset]);

      const handleCameraChange = (preset) => {
        setCameraPreset(preset);
        if (!cameraRef.current || !controlsRef.current) return;

        const krakatauPos = latLngToVector3(KRAKATAU_LAT, KRAKATAU_LNG, GLOBE_RADIUS);
        const normal = krakatauPos.clone().normalize();

        if (preset === 'krakatau') {
          const camOffset = normal.clone().multiplyScalar(140).add(new THREE.Vector3(20, 30, 40));
          cameraRef.current.position.copy(krakatauPos.clone().add(camOffset));
          controlsRef.current.target.copy(krakatauPos);
        } else if (preset === 'regional') {
          const camOffset = normal.clone().multiplyScalar(450);
          cameraRef.current.position.copy(krakatauPos.clone().add(camOffset));
          controlsRef.current.target.copy(krakatauPos);
        } else if (preset === 'globe') {
          cameraRef.current.position.set(0, 300, 950);
          controlsRef.current.target.set(0, 0, 0);
        }
      };

      const maxFrames = (trajectoryData.path ? trajectoryData.path.length : 1) - 1;

      return (
        <div className="relative w-full h-[520px] glass-panel rounded-2xl overflow-hidden flex flex-col">
          
          <div ref={containerRef} className="w-full h-full cursor-grab active:cursor-grabbing flex-1" />

          <div className="absolute top-4 left-4 z-10 flex flex-wrap items-center gap-2 bg-slate-950/80 backdrop-blur-md p-1.5 rounded-xl border border-slate-800 text-xs">
            <span className="text-slate-400 font-medium px-2 hidden sm:inline">Kamera 3D:</span>

            <button
              onClick={() => handleCameraChange('krakatau')}
              className={`px-3 py-1 rounded-lg border font-medium transition ${
                cameraPreset === 'krakatau' ? 'bg-cyan-500/20 text-cyan-300 border-cyan-500/50' : 'bg-slate-900/60 text-slate-400 border-slate-800'
              }`}
            >
              <i className="fa-solid fa-volcano mr-1 text-magma-400"></i> Krakatau
            </button>

            <button
              onClick={() => handleCameraChange('regional')}
              className={`px-3 py-1 rounded-lg border font-medium transition ${
                cameraPreset === 'regional' ? 'bg-cyan-500/20 text-cyan-300 border-cyan-500/50' : 'bg-slate-900/60 text-slate-400 border-slate-800'
              }`}
            >
              <i className="fa-solid fa-map mr-1"></i> Selat Sunda
            </button>

            <button
              onClick={() => handleCameraChange('globe')}
              className={`px-3 py-1 rounded-lg border font-medium transition ${
                cameraPreset === 'globe' ? 'bg-cyan-500/20 text-cyan-300 border-cyan-500/50' : 'bg-slate-900/60 text-slate-400 border-slate-800'
              }`}
            >
              <i className="fa-solid fa-earth-asia mr-1"></i> Globe
            </button>

            <button
              onClick={() => handleCameraChange('follow')}
              className={`px-3 py-1 rounded-lg border font-medium transition ${
                cameraPreset === 'follow' ? 'bg-cyan-500/20 text-cyan-300 border-cyan-500/50' : 'bg-slate-900/60 text-slate-400 border-slate-800'
              }`}
            >
              <i className="fa-solid fa-crosshairs mr-1 text-emerald-400"></i> Ikuti Proyektil
            </button>
          </div>

          <div className="absolute bottom-4 left-4 right-4 z-10 bg-slate-950/90 backdrop-blur-md p-3 rounded-xl border border-slate-800 flex flex-col md:flex-row items-center gap-3">
            <div className="flex items-center gap-2">
              {simStatus === 'running' ? (
                <button
                  onClick={onPause}
                  className="w-9 h-9 rounded-lg bg-amber-600 hover:bg-amber-500 text-white flex items-center justify-center font-bold text-sm shadow-md"
                  title="Jeda"
                >
                  <i className="fa-solid fa-pause"></i>
                </button>
              ) : (
                <button
                  onClick={onRun}
                  className="w-9 h-9 rounded-lg bg-gradient-to-r from-magma-600 to-orange-500 hover:from-magma-500 hover:to-orange-400 text-white flex items-center justify-center font-bold text-sm shadow-md magma-glow"
                  title="Lontarkan / Lanjutkan"

                  <i className="fa-solid fa-play"></i>
                </button>
              )}

              <button
                onClick={onReset}
                className="w-9 h-9 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center text-sm border border-slate-700"
                title="Reset Lontaran"
              >
                <i className="fa-solid fa-rotate-left"></i>
              </button>
            </div>

            <div className="flex-1 w-full flex items-center gap-3">
              <span className="text-[11px] font-mono text-cyan-400 font-bold whitespace-nowrap">
                t = {trajectoryData.path && trajectoryData.path[activePointIndex] ? trajectoryData.path[activePointIndex].t.toFixed(2) : '0.00'} s
              </span>

              <input
                type="range"
                min="0"
                max={maxFrames > 0 ? maxFrames : 100}
                value={activePointIndex}

              <span className="text-[11px] font-mono text-slate-400 whitespace-nowrap">

              </span>
            </div>
          </div>

        </div>
      );
    }

    function TrajectoryChart({ rk4Data, eulerData, noDragData }) {
      const canvasRef = useRef(null);
      const chartInstanceRef = useRef(null);

      useEffect(() => {
        if (!canvasRef.current) return;

        const ctx = canvasRef.current.getContext('2d');

        if (chartInstanceRef.current) {
          chartInstanceRef.current.destroy();
        }

        const datasets = [
          {
            label: 'Lintasan RK4',
            data: rk4Data.path.map((p) => ({ x: p.x, y: p.y })),
            borderColor: '#00f0ff',
            backgroundColor: 'rgba(0, 240, 255, 0.08)',
            borderWidth: 2.5,
            pointRadius: 0,
            fill: true,
          },
          {
            label: 'Metode Euler',
            data: eulerData.path.map((p) => ({ x: p.x, y: p.y })),
            borderColor: '#ff8a3d',
            borderDash: [5, 5],
            borderWidth: 2,
            pointRadius: 0,
            fill: false,
          },
          {
            label: 'Ideal (Tanpa Drag)',
            data: noDragData.path.map((p) => ({ x: p.x, y: p.y })),
            borderColor: '#64748b',
            borderDash: [2, 2],
            borderWidth: 1.5,
            pointRadius: 0,
            fill: false,
          }
        ];

        const chart = new Chart(ctx, {
          type: 'line',
          data: { datasets },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { labels: { color: '#94a3b8', font: { size: 11 } } },
            },
            scales: {
              x: {
                type: 'linear',
                title: { display: true, text: 'Jarak Horizontal X (m)', color: '#94a3b8' },
                grid: { color: 'rgba(255, 255, 255, 0.04)' },
                ticks: { color: '#94a3b8' }
              },
              y: {
                title: { display: true, text: 'Ketinggian Y (m)', color: '#94a3b8' },
                grid: { color: 'rgba(255, 255, 255, 0.04)' },
                ticks: { color: '#94a3b8' },
                min: 0
              }
            }
          }
        });

        chartInstanceRef.current = chart;

        return () => {
          if (chartInstanceRef.current) chartInstanceRef.current.destroy();
        };
      }, [rk4Data, eulerData, noDragData]);

      return (
        <div className="glass-panel rounded-2xl p-4">
          <div className="flex items-center justify-between mb-3 border-b border-slate-800 pb-2">
            <h3 className="text-xs font-bold uppercase tracking-wider text-slate-300 flex items-center gap-2">

          </div>
          <div className="relative w-full h-[290px]">
            <canvas ref={canvasRef}></canvas>
          </div>
        </div>
      );
    }

    function FreeBodyDiagram({ currentFrame }) {
      if (!currentFrame) return null;

      const { vx, vy, fDragX, fDragY, ax, ay } = currentFrame;
      const scaleF = 0.05;
      const fgLen = 80;

      const fdX = fDragX * scaleF;
      const fdY = fDragY * scaleF;

      return (
        <div className="glass-panel rounded-2xl p-4 flex flex-col items-center justify-center">
          <div className="w-full flex justify-between items-center border-b border-slate-800 pb-2 mb-2">

            <text x="118" y={95 + fgLen - 10} fill="#38bdf8" fontSize="10" fontWeight="bold">W = mg</text>

              <g>
                <line

                  y2={95 - Math.max(-70, Math.min(70, fdY))}

                  strokeWidth="3"
                />
                <text
                  x={115 + Math.max(-70, Math.min(70, fdX))}

            <line
              x1="110"

    function GeospatialMap({ simParams, trajectorySummary }) {
      const mapContainerRef = useRef(null);
      const mapInstanceRef = useRef(null);

      useEffect(() => {
        if (!mapContainerRef.current) return;

        if (mapInstanceRef.current) {
          mapInstanceRef.current.remove();
        }

        const map = L.map(mapContainerRef.current).setView([KRAKATAU_LAT, KRAKATAU_LNG], 10);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
          attribution: '&copy; OpenStreetMap contributors & CartoDB',
          maxZoom: 14,
        }).addTo(map);

        const volcanoIcon = L.divIcon({
          className: 'custom-volcano-icon',
          html: `<div style="background:#ff6600; width:18px; height:18px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 15px #00f0ff;"></div>`,
          iconSize: [18, 18],
          iconAnchor: [9, 9]
        });

        L.marker([KRAKATAU_LAT, KRAKATAU_LNG], { icon: volcanoIcon })
          .addTo(map)
          .bindPopup(`<b>Gunung Anak Krakatau</b><br>Ketinggian Kawah: ${simParams.y0} m`);

        [5000, 15000, 30000].map((radius, idx) => {
          L.circle([KRAKATAU_LAT, KRAKATAU_LNG], {
            radius: radius,
            color: idx === 0 ? '#ef4444' : idx === 1 ? '#f59e0b' : '#3b82f6',
            weight: 1.5,
            fillOpacity: 0.05,
            dashArray: '4,4'
          }).addTo(map);
        });

        if (trajectorySummary && trajectorySummary.maxRange > 0) {
          const rangeKm = trajectorySummary.maxRange / 1000;
          const headingRad = (simParams.headingAngle * Math.PI) / 180;
          
          const deltaLat = (rangeKm * Math.cos(headingRad)) / 111;
          const deltaLng = (rangeKm * Math.sin(headingRad)) / (111 * Math.cos(KRAKATAU_LAT * Math.PI / 180));

          const targetLat = KRAKATAU_LAT + deltaLat;
          const targetLng = KRAKATAU_LNG + deltaLng;

          L.marker([targetLat, targetLng])
            .addTo(map)
            .bindPopup(`<b>Zona Tumbukan Tephra</b><br>Jarak Lontar: ${trajectorySummary.maxRange.toFixed(0)} m`);

          L.polyline([
            [KRAKATAU_LAT, KRAKATAU_LNG],
            [targetLat, targetLng]
          ], { color: '#00f0ff', weight: 2.5, dashArray: '6,6' }).addTo(map);
        }

        mapInstanceRef.current = map;

        return () => {
          if (mapInstanceRef.current) mapInstanceRef.current.remove();
        };
      }, [simParams, trajectorySummary]);

      return (
        <div className="glass-panel rounded-2xl p-4 flex flex-col gap-3">
          <div className="flex items-center justify-between border-b border-slate-800 pb-2">
            <div className="flex items-center gap-2">
              <i className="fa-solid fa-map-location-dot text-cyan-400"></i>
              <h3 className="text-xs font-bold uppercase tracking-wider text-slate-300">Peta Geospasial Krakatau & Selat Sunda</h3>
            </div>
            <span className="text-xs text-cyan-400 bg-cyan-950/80 px-2.5 py-0.5 rounded-full border border-cyan-800/60 font-mono">
              GPS: -6.102, 105.423
            </span>
          </div>

          <div className="relative w-full h-[420px]">
            <div ref={mapContainerRef} className="w-full h-full rounded-xl z-0" />
          </div>
        </div>
      );
    }

              <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-magma-600 to-orange-400 flex items-center justify-center text-white text-xl shadow-lg magma-glow">
                <i className="fa-solid fa-volcano"></i>
              </div>
              <div>
                <h1 className="text-base font-bold text-slate-100 flex items-center gap-2">
                  Krakatau Trajectory Lab
                  <span className="text-[10px] uppercase tracking-widest px-2 py-0.5 rounded-full bg-cyan-500/20 text-cyan-400 border border-cyan-500/30">
                    v2.0 3D
                  </span>
                </h1>
                <p className="text-xs text-slate-400">Workbench Simulasi Balistik Lontaran Tephra Gunung Anak Krakatau</p>
              </div>
            </div>

            <nav className="flex items-center gap-1 overflow-x-auto w-full md:w-auto pb-1 md:pb-0">
              {tabs.map((tab) => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`px-3 py-1.5 rounded-xl text-xs font-medium transition flex items-center gap-2 whitespace-nowrap ${
                    activeTab === tab.id
                      ? 'bg-cyan-500/20 text-cyan-300 border border-cyan-500/40 shadow-sm'
                      : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'
                  }`}
                >
                  <i className={`fa-solid ${tab.icon}`}></i>
                  {tab.label}
                </button>
              ))}

              <button
                onClick={onOpenTour}
                className="ml-2 px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-amber-400 border border-amber-500/30 flex items-center gap-1.5 whitespace-nowrap"
              >
                <i className="fa-solid fa-compass"></i>
                Panduan
              </button>
            </nav>
          </div>
        </header>
      );
    }

    function ParameterPanel({ params, setParams, simStatus, onRun, onPause, onReset, onSelectPreset, onExport }) {
      const handleChange = (key, value) => {
        setParams((prev) => ({ ...prev, [key]: parseFloat(value) || 0 }));
      };

      return (
        <div className="glass-panel rounded-2xl p-4 space-y-4">
          <div className="flex items-center justify-between border-b border-slate-800 pb-2">
            <h2 className="text-xs font-bold uppercase tracking-wider text-slate-300 flex items-center gap-2">
              <i className="fa-solid fa-sliders text-magma-400"></i>
              Parameter Erupsi & Lingkungan
            </h2>
            <button
              onClick={onExport}
              className="text-xs text-cyan-400 hover:text-cyan-300 flex items-center gap-1 font-mono bg-cyan-950/60 px-2 py-1 rounded-lg border border-cyan-800/50"
              title="Ekspor Data CSV"
            >
              <i className="fa-solid fa-download"></i> CSV
            </button>
          </div>

          <div>
            <label className="text-[11px] font-semibold text-slate-400 block mb-1">Preset Skenario Erupsi:</label>
            <div className="grid grid-cols-2 gap-1.5">
              {Object.keys(PRESETS).map((key) => (
                <button
                  key={key}
                  onClick={() => onSelectPreset(key)}
                  className="px-2.5 py-1.5 rounded-xl text-left bg-slate-900/80 hover:bg-slate-800 border border-slate-800 transition"
                >
                  <div className="text-xs font-semibold text-slate-200">{PRESETS[key].name}</div>
                  <div className="text-[10px] text-slate-400 truncate">{PRESETS[key].desc}</div>
                </button>
              ))}
            </div>
          </div>

          <div className="space-y-3 pt-2">
            <div>
              <div className="flex justify-between text-xs mb-1">
                <span className="text-slate-300">Kecepatan Awal Lontaran (v₀):</span>
                <span className="font-mono text-cyan-400">{params.v0} m/s</span>
              </div>
              <input
                type="range" min="50" max="1200" step="10"
                value={params.v0}
                onChange={(e) => handleChange('v0', e.target.value)}
                className="w-full accent-magma-500 bg-slate-800 h-1.5 rounded-lg cursor-pointer"
              />
            </div>

            <div>
              <div className="flex justify-between text-xs mb-1">
                <span className="text-slate-300">Sudut Elevasi Lontar (θ):</span>
                <span className="font-mono text-cyan-400">{params.angle}°</span>
              </div>
              <input
                type="range" min="10" max="85" step="1"
                value={params.angle}
                onChange={(e) => handleChange('angle', e.target.value)}
                className="w-full accent-magma-500 bg-slate-800 h-1.5 rounded-lg cursor-pointer"
              />
            </div>

            <div>
              <div className="flex justify-between text-xs mb-1">
                <span className="text-slate-300">Arah Kompas Lontaran (Heading):</span>
                <span className="font-mono text-cyan-400">{params.headingAngle}°</span>
              </div>
              <input
                type="range" min="0" max="360" step="5"
                value={params.headingAngle}
                onChange={(e) => handleChange('headingAngle', e.target.value)}
                className="w-full accent-cyan-500 bg-slate-800 h-1.5 rounded-lg cursor-pointer"
              />
            </div>

            <div>
              <div className="flex justify-between text-xs mb-1">
                <span className="text-slate-300">Massa Proyektil Tephra (m):</span>
                <span className="font-mono text-cyan-400">{params.mass} kg</span>
              </div>
              <input
                type="range" min="50" max="10000" step="50"
                value={params.mass}
                onChange={(e) => handleChange('mass', e.target.value)}
                className="w-full accent-magma-500 bg-slate-800 h-1.5 rounded-lg cursor-pointer"
              />
            </div>

            <div>
              <div className="flex justify-between text-xs mb-1">
                <span className="text-slate-300">Kecepatan Angin:</span>
                <span className="font-mono text-cyan-400">{params.windSpeed} m/s</span>
              </div>
              <input
                type="range" min="0" max="80" step="1"
                value={params.windSpeed}
                onChange={(e) => handleChange('windSpeed', e.target.value)}
                className="w-full accent-sky-500 bg-slate-800 h-1.5 rounded-lg cursor-pointer"
              />
            </div>

            <div>
              <div className="flex justify-between text-xs mb-1">
                <span className="text-slate-300">Elevasi Kawah (y₀):</span>
                <span className="font-mono text-cyan-400">{params.y0} m</span>
              </div>
              <input
                type="range" min="0" max="800" step="10"
                value={params.y0}
                onChange={(e) => handleChange('y0', e.target.value)}
                className="w-full accent-emerald-500 bg-slate-800 h-1.5 rounded-lg cursor-pointer"
              />
            </div>

            <div className="grid grid-cols-2 gap-2 pt-1">
              <div>
                <label className="text-[11px] text-slate-400 block mb-1">Koefisien Drag (C_d):</label>
                <input
                  type="number" step="0.01"
                  value={params.cd}
                  onChange={(e) => handleChange('cd', e.target.value)}
                  className="w-full bg-slate-900 border border-slate-800 rounded-lg p-1.5 text-xs font-mono text-cyan-300 focus:outline-none focus:border-cyan-500"
                />
              </div>
              <div>
                <label className="text-[11px] text-slate-400 block mb-1">Metode Integrasi:</label>
                <select
                  value={params.solver}
                  onChange={(e) => handleChange('solver', e.target.value)}
                  className="w-full bg-slate-900 border border-slate-800 rounded-lg p-1.5 text-xs text-cyan-300 focus:outline-none focus:border-cyan-500"
                >
                  <option value="rk4">Runge-Kutta 4 (RK4)</option>
                  <option value="euler">Metode Euler</option>
                </select>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function SimulationTour({ isOpen, onClose }) {
      const [step, setStep] = useState(0);

      if (!isOpen) return null;

      const steps = [
        {
          title: '3D Globe Krakatau Simulation',
          desc: 'Simulasi ini memvisualisasikan lontaran proyektil tephra Anak Krakatau di koordinat geografis nyata (Selat Sunda) pada globe 3D.',
          icon: 'fa-globe'
        },
        {
          title: '1. Navigasi Globe 3D',
          desc: 'Gunakan mouse untuk merotasi globe bumi 3D dan beralih antara kamera Krakatau, Selat Sunda, atau ikuti proyektil.',
          icon: 'fa-cube'
        },
        {
          title: '2. Parameter Erupsi & Kompas',
          desc: 'Sesuaikan kecepatan awal (v₀), sudut elevasi (θ), serta arah lontaran kompas (Heading Angle) pada panel kontrol.',
          icon: 'fa-sliders'
        }
      ];

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-sm p-4">
          <div className="glass-panel max-w-md w-full rounded-2xl p-6 border border-slate-700 shadow-2xl relative">
            <div className="flex items-center gap-3 mb-4">
              <div className="w-10 h-10 rounded-xl bg-cyan-500/20 text-cyan-400 flex items-center justify-center text-xl border border-cyan-500/30">
                <i className={`fa-solid ${steps[step].icon}`}></i>
              </div>
              <div>
                <h3 className="text-sm font-bold text-slate-100">{steps[step].title}</h3>
                <p className="text-[11px] text-slate-400">Langkah {step + 1} dari {steps.length}</p>
              </div>
            </div>

            <p className="text-xs text-slate-300 leading-relaxed mb-6">
              {steps[step].desc}
            </p>

            <div className="flex items-center justify-between border-t border-slate-800 pt-4">
              <button onClick={onClose} className="text-xs text-slate-400 hover:text-slate-200">
                Tutup
              </button>

              <div className="flex items-center gap-2">
                {step > 0 && (
                  <button onClick={() => setStep(step - 1)} className="px-3 py-1.5 rounded-lg bg-slate-800 text-xs text-slate-300">
                    Sebelumnya
                  </button>
                )}
                {step < steps.length - 1 ? (
                  <button onClick={() => setStep(step + 1)} className="px-4 py-1.5 rounded-lg bg-cyan-600 text-xs font-semibold text-white">
                    Berikutnya
                  </button>
                ) : (
                  <button onClick={onClose} className="px-4 py-1.5 rounded-lg bg-emerald-600 text-xs font-semibold text-white">
                    Mulai Eksperimen
                  </button>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [activeTab, setActiveTab] = useState('3d');
      const [simParams, setSimParams] = useState(DEFAULT_PARAMS);
      const [simStatus, setSimStatus] = useState('running');
      const [activeFrameIndex, setActiveFrameIndex] = useState(0);
      const [isTourOpen, setIsTourOpen] = useState(false);

      const rk4Trajectory = useMemo(() => computeTrajectory(simParams, 'rk4'), [simParams]);
      const eulerTrajectory = useMemo(() => computeTrajectory(simParams, 'euler'), [simParams]);
      const noDragTrajectory = useMemo(() => computeTrajectory(simParams, 'rk4', 0), [simParams]);

      const activeTrajectory = simParams.solver === 'rk4' ? rk4Trajectory : eulerTrajectory;

      useEffect(() => {
        if (simStatus !== 'running') return;

        const interval = setInterval(() => {
          setActiveFrameIndex((prev) => {
            if (prev >= activeTrajectory.path.length - 1) {
              setSimStatus('finished');
              return prev;
            }
            return prev + 1;
          });
        }, 20);

        return () => clearInterval(interval);
      }, [simStatus, activeTrajectory]);

      const handleRun = () => {
        if (simStatus === 'finished' || activeFrameIndex >= activeTrajectory.path.length - 1) {
          setActiveFrameIndex(0);
        }
        setSimStatus('running');
      };

      const handlePause = () => setSimStatus('paused');
      const handleReset = () => {
        setSimStatus('ready');
        setActiveFrameIndex(0);
      };

      const handlePresetSelect = (presetKey) => {
        setSimParams(PRESETS[presetKey].params);
        setSimStatus('running');
        setActiveFrameIndex(0);
      };

      const handleExport = () => {
        const headers = "t(s),x(m),y(m),vx(m/s),vy(m/s),v(m/s),F_drag(N)\n";
        const rows = activeTrajectory.path.map((p) =>
          `${p.t},${p.x.toFixed(2)},${p.y.toFixed(2)},${p.vx.toFixed(2)},${p.vy.toFixed(2)},${p.v.toFixed(2)},${p.fDrag.toFixed(2)}`
        ).join("\n");

        const blob = new Blob([headers + rows], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `krakatau_lab_report_${Date.now()}.csv`;
        a.click();
      };

      const currentFrame = activeTrajectory.path[activeFrameIndex] || activeTrajectory.path[0];

      return (
        <div className="min-h-screen flex flex-col pb-12">
          
          <Header
            activeTab={activeTab}
            setActiveTab={setActiveTab}
            onOpenTour={() => setIsTourOpen(true)}
          />

          <main className="max-w-7xl mx-auto w-full px-4 pt-6 flex-1 space-y-6">
            
            {activeTab === '3d' && (
              <div className="space-y-6">
                <StatisticsCards summary={activeTrajectory.summary} />

                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                  <div className="lg:col-span-4">
                    <ParameterPanel
                      params={simParams}
                      setParams={setSimParams}
                      simStatus={simStatus}
                      onRun={handleRun}
                      onPause={handlePause}
                      onReset={handleReset}
                      onSelectPreset={handlePresetSelect}
                      onExport={handleExport}
                    />
                  </div>

                  <div className="lg:col-span-8 space-y-6">
                    <Globe3DVisualizer
                      trajectoryData={activeTrajectory}
                      simParams={simParams}
                      activePointIndex={activeFrameIndex}
                      simStatus={simStatus}
                      onRun={handleRun}
                      onPause={handlePause}
                      onReset={handleReset}
                      setActiveFrameIndex={setActiveFrameIndex}
                    />

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                      <div className="md:col-span-2">
                        <TrajectoryChart
                          rk4Data={rk4Trajectory}
                          eulerData={eulerTrajectory}
                          noDragData={noDragTrajectory}
                        />
                      </div>
                      <div className="md:col-span-1">
                        <FreeBodyDiagram currentFrame={currentFrame} />
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'map' && (
              <GeospatialMap
                simParams={simParams}
                trajectorySummary={activeTrajectory.summary}
              />
            )}

            {activeTab === 'analytics' && (
              <div className="space-y-6">
                <StatisticsCards summary={activeTrajectory.summary} />
                <TrajectoryChart
                  rk4Data={rk4Trajectory}
                  eulerData={eulerTrajectory}
                  noDragData={noDragTrajectory}
                />
              </div>
            )}

            {activeTab === 'numerical' && (
              <NumericalAnalysis simParams={simParams} />
            )}

            {activeTab === 'theory' && (
              <TheoryPanel />
            )}

            {activeTab === 'about' && (
              <div className="glass-panel max-w-2xl mx-auto rounded-2xl p-6 text-center space-y-4">
                <div className="w-16 h-16 rounded-2xl bg-cyan-500/10 text-cyan-400 mx-auto flex items-center justify-center text-3xl border border-cyan-500/20">
                  <i className="fa-solid fa-volcano"></i>
                </div>
                <h2 className="text-lg font-bold text-slate-100">Krakatau Trajectory Lab Workbench</h2>
                <p className="text-xs text-slate-400 leading-relaxed">
                  Platform simulasi komputasi fisika interaktif berbasis 3D Globe untuk mempelajari mekanika gerak proyektil tephra Gunung Anak Krakatau pada posisi koordinat nyata Selat Sunda (-6.102° S, 105.423° E).
                </p>
              </div>
            )}

          </main>

          <SimulationTour
            isOpen={isTourOpen}
            onClose={() => setIsTourOpen(false)}
          />

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
